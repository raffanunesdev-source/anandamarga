<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorriso Capital | Painel da Mentoria</title>
<style>
:root{
  --gold-d:#B8862B; --gold:#D4A843; --gold-l:#F0D98A;
  --champ:#FBF5E6; --cream:#F5EAD0; --line:#EADFC4;
  --ink:#3E2C16; --mute:#7A6A52; --bg:#F4EEE1; --card:#FFFFFF;
  --ok:#2F7D4F; --warn:#B7791F; --bad:#B3412B; --info:#2F5F8A;
  --side:#2B1D0A; --side-ink:#EBDDB8; --side-mute:#A8987A;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --gold-grad:linear-gradient(135deg,#B8862B 0%,#E8C766 50%,#B8862B 100%);
  --sw:272px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--gold-d)}
/* ===== Sidebar ===== */
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.brand{padding:20px 20px 14px;border-bottom:1px solid #4a3818}
.brand b{display:block;font:600 22px/1.1 var(--serif);color:var(--gold-l);letter-spacing:.3px}
.brand span{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--side-mute)}
nav{flex:1;overflow:auto;padding:8px 10px 20px}
.grp{font:600 10px var(--sans);letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);padding:16px 10px 6px}
.grp.cow{color:#8FD0C0}
nav a.it{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:1px 0;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:13px;border-left:3px solid transparent}
nav a.it:hover{background:#3a2a10}
nav a.it.on{background:#43300f;border-left-color:var(--gold);color:#fff}
nav a.it .n{width:20px;font-size:11px;color:var(--side-mute);text-align:right;flex:none}
nav a.it .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#6b5a3a;flex:none}
nav a.it .dot.ready{background:#6ED39A}
.side-foot{padding:12px 20px;border-top:1px solid #4a3818;font-size:11px;color:var(--side-mute)}
/* ===== Topbar / main ===== */
.top{display:none;position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.top button{border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer}
.top b{font:600 18px var(--serif)}
main{margin-left:var(--sw);padding:28px 36px 60px;max-width:1180px;min-height:100%}
.scrim{display:none;position:fixed;inset:0;background:rgba(30,20,5,.5);z-index:35}
/* ===== Content ===== */
.crumb{font:500 11px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px}
h1{font:600 34px/1.1 var(--serif);margin:0 0 6px}
h1 em{font-style:italic;color:var(--gold-d);font-weight:500}
.lead{color:var(--mute);font-size:15px;max-width:760px;margin:0 0 22px}
h2{font:600 22px var(--serif);margin:30px 0 10px}
h3{font:600 14px var(--sans);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .v{font:600 30px/1 var(--serif);color:var(--ink)}
.kpi .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-top:6px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:4px}
.tag{display:inline-block;font:600 10px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--cream);color:var(--gold-d)}
.tag.ok{background:#E4F3EA;color:var(--ok)} .tag.warn{background:#FBEFD6;color:var(--warn)} .tag.bad{background:#FBE5E0;color:var(--bad)} .tag.info{background:#E3EDF6;color:var(--info)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 10.5px var(--sans);letter-spacing:1.1px;text-transform:uppercase;color:var(--gold-d);text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--gold);background:var(--champ);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
.callout{border-left:4px solid var(--gold);background:var(--champ);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.warn{border-color:var(--warn);background:#FFF8E8}
.callout.ok{border-color:var(--ok);background:#EFF8F2}
.callout b{display:block;margin-bottom:2px}
ul.clean{margin:6px 0 0;padding-left:18px} ul.clean li{margin:3px 0}
.bar{height:10px;border-radius:6px;background:var(--cream);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--gold-grad)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:10px}
.stub{border:1.5px dashed var(--gold);background:var(--champ);border-radius:14px;padding:26px;text-align:center}
.stub h2{margin-top:0}
.src{font-size:11.5px;color:var(--mute);margin-top:18px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-grad);color:#2B1D0A;font:600 12px var(--sans);display:grid;place-items:center}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
/* ===== Mobile ===== */
@media (max-width:900px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .side{transform:translateX(-100%)}
  body.open .side{transform:none}
  body.open .scrim{display:block}
  .top{display:flex}
  main{margin-left:0;padding:20px 16px 50px}
  h1{font-size:28px}
}
@media (max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><b>Sorriso Capital</b><span>Painel da mentoria</span></div>
  <nav id="nav" aria-label="Menu principal"></nav>
  <div class="side-foot">Atualizado em 12/11/2026<br>Dados públicos coletados via Apify</div>
</aside>
<div class="scrim" id="scrim"></div>
<header class="top"><button id="burger" aria-label="Abrir menu">☰</button><b id="topTitle">Sorriso Capital</b></header>
<main id="view" tabindex="-1"></main>

<script>
/* ===== Menu: ready=true quando existe views/<id>.js ===== */
const MENU = [
  {g:'Visão geral'},
  {id:'visao-geral', t:'Resumo e roadmap', ready:true},
  {id:'diagnostico', t:'Diagnóstico do Instagram', ready:true},
  {id:'concorrentes', t:'Concorrentes', ready:true},
  {id:'conformidade', t:'Checklist RDC 1.002/2025', ready:true},
  {g:'Clínica', cls:''},
  {id:'cli-posicionamento', t:'Posicionamento e ofertas', ready:true},
  {id:'cli-funil', t:'Funil de vendas', ready:true},
  {id:'cli-crc', t:'Processo comercial e treinamento da CRC', ready:true},
  {id:'cli-preco', t:'Precificação', ready:true},
  {id:'cli-ads', t:'Campanhas Meta Ads (paciente)', ready:true},
  {id:'cli-reels', t:'Reels (roteiros)', ready:true},
  {id:'cli-carrosseis', t:'Carrosséis', ready:true},
  {id:'cli-metricas', t:'Métricas', ready:true},
  {g:'Coworking', cls:'cow'},
  {id:'cow-oferta', t:'Oferta e preços', ready:true},
  {id:'cow-funil', t:'Funil de captação de dentistas', ready:true},
  {id:'cow-ads', t:'Campanha Meta Ads (profissionais)', ready:true},
  {id:'cow-criativos', t:'Criativos (Reels e carrossel)', ready:true},
  {id:'cow-regras', t:'Regras, regimento e contratos', ready:true},
  {id:'cow-kits', t:'Kits esterilizados', ready:true},
  {id:'cow-metricas', t:'Métricas', ready:true}
];
const VIEWS = {};
window.registerView = (id, html) => { VIEWS[id] = html; };
const VIEW_INIT = {};
window.onView = (id, fn) => { VIEW_INIT[id] = fn; };

const nav = document.getElementById('nav'), main = document.getElementById('view');
let n = 0;
MENU.forEach(m => {
  if (m.g) { const h = document.createElement('div'); h.className = 'grp ' + (m.cls||''); h.textContent = m.g; nav.appendChild(h); return; }
  n++; m.n = n;
  const a = document.createElement('a'); a.className = 'it'; a.href = '#/' + m.id; a.dataset.id = m.id;
  a.innerHTML = '<span class="n">'+n+'</span><span>'+m.t+'</span><span class="dot '+(m.ready?'ready':'')+'" title="'+(m.ready?'Pronto':'Em construção')+'"></span>';
  nav.appendChild(a);
});

/* ===== Checklists: marcações salvas no navegador ===== */
const CK = 'sorriso-capital-checklist-v1';
function ckStore(){ try { return JSON.parse(localStorage.getItem(CK) || '{}'); } catch(e){ return {}; } }
function ckSave(o){ try { localStorage.setItem(CK, JSON.stringify(o)); } catch(e){} }
function ckUpdate(){
  const all = [...main.querySelectorAll('input[data-k]')]; if (!all.length) return;
  const done = all.filter(i => i.checked).length;
  const t = document.getElementById('ckTotal'); if (t) t.textContent = done + ' de ' + all.length;
  const b = document.getElementById('ckBar'); if (b) b.style.width = (all.length ? Math.round(done/all.length*100) : 0) + '%';
  const blk = document.getElementById('ckBlock');
  if (blk) blk.textContent = all.filter(i => !i.checked && i.parentElement.querySelector('.tag.bad')).length;
  main.querySelectorAll('.ck-sec').forEach(s => {
    const a = [...s.querySelectorAll('input[data-k]')], c = s.querySelector('[data-cnt]');
    if (c) c.textContent = a.filter(i => i.checked).length + '/' + a.length;
  });
}
function ckHydrate(){ const s = ckStore(); main.querySelectorAll('input[data-k]').forEach(i => { i.checked = !!s[i.dataset.k]; }); ckUpdate(); }
window.ckReset = () => { if (!confirm('Limpar todas as marcações deste checklist?')) return; const s = ckStore(); Object.keys(s).forEach(k => { if (k.startsWith('rdc-')) delete s[k]; }); ckSave(s); ckHydrate(); };
main.addEventListener('change', e => {
  if (e.target.matches('input[data-k]')) { const s = ckStore(); s[e.target.dataset.k] = e.target.checked; ckSave(s); ckUpdate(); }
});

function stub(m){
  return '<div class="crumb">'+m.t+'</div><h1>'+m.t+'</h1><p class="lead">Esta tela será entregue na próxima etapa da mentoria.</p>'+
    '<div class="stub"><span class="tag warn">Em construção</span><h2>O que vai entrar aqui</h2><p style="max-width:620px;margin:0 auto">'+(m.d||'')+'</p></div>';
}

/* ===== view: cli-ads ===== */
(function(){
registerView('cli-ads', `
<div class="crumb">Clínica</div>
<h1>Campanhas Meta Ads para <em>pacientes</em></h1>
<p class="lead">Estrutura de campanhas para lentes e facetas, harmonização facial e clareamento em Brasília, a partir dos anúncios que os concorrentes têm no ar (Biblioteca de Anúncios da Meta, coleta de 12/11/2026) e das regras de publicidade da odontologia.</p>

<div class="grid g4">
  <div class="card kpi"><div class="v">0</div><div class="l">Anúncios de paciente hoje</div><div class="s">O único anúncio da clínica é de coworking</div></div>
  <div class="card kpi"><div class="v">40+</div><div class="l">Páginas anunciando estética em Brasília</div><div class="s">Inclui clínicas médicas e odontológicas</div></div>
  <div class="card kpi"><div class="v">9.087</div><div class="l">Audiência da Dra. Rayane</div><div class="s">Perfil de harmonização facial</div></div>
  <div class="card kpi"><div class="v">27/11</div><div class="l">Black Friday</div><div class="s">Concorrentes já estão com anúncios sazonais</div></div>
</div>

<div class="callout warn"><b>Antes de tudo: regras da odontologia</b>O Código de Ética Odontológico (CFO 118/2012) veda divulgar preços, formas de pagamento e serviços gratuitos em publicidade; a Resolução CFO 196/2019 liberou imagens de diagnóstico e resultado, com autorização expressa do paciente e caso do próprio profissional. Vários concorrentes anunciam preço e promoção; isso não torna permitido. Os rascunhos desta tela já evitam preço, desconto, parcelamento e "grátis". Confirmar com o CRO-DF ou advogado antes de rodar.</div>

<h2>O que os concorrentes anunciam</h2>
<div class="tblw"><table>
<tr><th>Anunciante</th><th>Foco</th><th>Como anuncia</th></tr>
<tr><td><b>Huff Life (Brasília DF)</b></td><td>Estética de preço baixo</td><td>13 anúncios desde 03/11/2026, vídeo e carrossel, com preços na copy (ex.: preenchimento 1 ml R$ 499,90; botox em 3 regiões R$ 549,90; rinomodelação R$ 899,90; harmonização 4 ml R$ 1.999,90). Os textos listam unidades de Porto Alegre e região.</td></tr>
<tr><td><b>Bruna e Saulo Odontologia e Estética Facial</b></td><td>Harmonização com história</td><td>9 anúncios desde 09/2025, carrosséis narrativos: homem que veio de Minas Gerais, paciente que emagreceu e perdeu contorno. Foco em emoção e naturalidade.</td></tr>
<tr><td><b>Dr. Yuri Nunes</b></td><td>Rinomodelação e reposicionamento facial</td><td>Imagens com texto de caso: "não queria mudar quem era", "não foi só preenchimento". CTA WhatsApp.</td></tr>
<tr><td><b>Dra. Bárbara Borges</b></td><td>Rinomodelação com fios (Asa Sul)</td><td>Black Friday com pergunta de dor ("a ponta do nariz caída incomoda você?"). Atenção: pergunta sobre característica da pessoa pode esbarrar na política de atributos pessoais da Meta.</td></tr>
<tr><td><b>Botocenter Brasília (Park Shopping)</b></td><td>Plano anual de botox</td><td>"Passe o ano inteiro renovada", 12x de R$ 159,90. Recorrência vendida como assinatura.</td></tr>
<tr><td><b>Dra. Dafine Saraiva</b></td><td>Harmonização</td><td>1 anúncio ativo desde 29/10/2026: imagem, depoimento ("a harmonização mudou minha vida"), CTA para o perfil.</td></tr>
<tr><td><b>Lentes: CCD, Verso, Ioog, Matheus Miranda, D'Or, Mundo Sorriso</b></td><td>Lentes de contato dental</td><td>Ver tela de Concorrentes: copy de objeção ("medo de ficar artificial"), landing page, Black Friday e âncora de preço.</td></tr>
<tr><td><b>Clareamento</b></td><td>-</td><td>Na coleta, não apareceu anúncio ativo de clareamento em Brasília. Pode ser espaço aberto, a validar com nova coleta.</td></tr>
</table></div>

<h2>Preço de tabela x anúncios de preço baixo</h2>
<div class="tblw"><table>
<tr><th>Procedimento</th><th class="r">Sorriso Capital (tabela)</th><th class="r">Huff Life (anúncio)</th></tr>
<tr><td>Botox (terço superior / 3 regiões)</td><td class="r">R$ 900</td><td class="r">R$ 549,90</td></tr>
<tr><td>Preenchimento (ácido hialurônico)</td><td class="r">R$ 1.000</td><td class="r">R$ 499,90 (1 ml)</td></tr>
<tr><td>Rinomodelação</td><td class="r">R$ 1.200</td><td class="r">R$ 899,90</td></tr>
</table></div>
<p class="src">Produtos, doses e marcas podem ser diferentes; é só referência de mercado. Sob as regras do CFO, a clínica não deve anunciar preço: a defesa do valor vem de naturalidade, indicação profissional, dentista responsável e planejamento, não de promoção.</p>

<h2>Posicionamento das ofertas</h2>
<div class="grid g3">
  <div class="card"><h3>1. Lentes e facetas</h3><p style="margin:0;color:var(--mute)">Ticket alto. Ângulo: sorriso natural, planejado para o rosto, sem aspecto artificial. Concorrentes fortes já ocupam esse espaço com anúncios e landing page.</p></div>
  <div class="card"><h3>2. Harmonização facial</h3><p style="margin:0;color:var(--mute)">Sob a Dra. Rayane, que tem audiência ("naturalidade, resultados elegantes e sem exageros", como diz o perfil). Mercado concorrido; o diferencial é rosto e sorriso tratados juntos por dentista.</p></div>
  <div class="card"><h3>3. Clareamento</h3><p style="margin:0;color:var(--mute)">Porta de entrada e de upgrade para lentes. Teste pequeno e barato para medir demanda.</p></div>
</div>

<h2>Estrutura recomendada</h2>
<div class="tblw"><table>
<tr><th>Campanha</th><th>Objetivo</th><th>Conjuntos de anúncios</th></tr>
<tr><td><b>C1 · Harmonização facial</b></td><td>Conversas no WhatsApp e, depois, cadastro no quiz</td><td>A) mulheres de Brasília, faixa 28 a 55, por região; B) público semelhante a quem engajou com o perfil da Dra. Rayane; C) remarketing de quem viu os Reels de transformação.</td></tr>
<tr><td><b>C2 · Lentes e facetas</b></td><td>Conversas e avaliações agendadas</td><td>A) público amplo de Brasília, 25 a 55, com o criativo fazendo a qualificação; B) remarketing de quem assistiu o vídeo de caso.</td></tr>
<tr><td><b>C3 · Clareamento</b></td><td>Teste de demanda</td><td>Um conjunto, orçamento mínimo, para ler o custo por conversa.</td></tr>
<tr><td><b>C4 · Remarketing e reativação</b></td><td>Recuperar quem já falou com a clínica</td><td>Pacientes da base, quem pediu orçamento e não fechou, quem agendou e faltou.</td></tr>
</table></div>
<div class="callout"><b>Comece enxuto</b>Com verba limitada, rodar C1 e C2 e deixar C3 como teste pequeno. Muitos conjuntos dividem a verba e atrasam o aprendizado. O orçamento ainda precisa ser definido com você.</div>

<h2>Onde o anúncio roda e para onde leva</h2>
<div class="grid g2">
  <div class="card"><h3>Identidade</h3><ul class="clean">
    <li>Harmonização: usar a conta do Instagram da Dra. Rayane (9.087 seguidores)</li>
    <li>Lentes: Sorriso Capital como marca, com a Dra. Rayane aparecendo na peça</li>
    <li>A página do Facebook da clínica tem 31 curtidas: pouca prova social</li></ul></div>
  <div class="card"><h3>Destino do clique</h3><ul class="clean">
    <li><b>Agora:</b> WhatsApp com mensagem pré-preenchida, atendida pela Mari em poucos minutos</li>
    <li><b>Em seguida:</b> quiz curto (procedimento de interesse, particular ou convênio) antes do WhatsApp, como a Dafine e a CCD</li>
    <li>Todo contato entra no Clinicorp com a origem do anúncio</li></ul></div>
</div>

<h2>Ângulos de criativo</h2>
<div class="tblw"><table>
<tr><th>#</th><th>Ângulo</th><th>Para</th><th>Formato</th></tr>
<tr><td>1</td><td>Natural e elegante, sem exageros</td><td>Harmonização</td><td>Vídeo da Dra. Rayane explicando a avaliação</td></tr>
<tr><td>2</td><td>Caso real narrado (com autorização)</td><td>Harmonização e lentes</td><td>Carrossel e vídeo de transformação</td></tr>
<tr><td>3</td><td>Quebra de objeção: "medo de ficar artificial"</td><td>Lentes</td><td>Vídeo curto e imagem</td></tr>
<tr><td>4</td><td>Sorriso e rosto em harmonia</td><td>Lentes + harmonização</td><td>Vídeo explicando o planejamento conjunto</td></tr>
<tr><td>5</td><td>Como funciona a avaliação</td><td>Todos</td><td>Carrossel de passo a passo</td></tr>
<tr><td>6</td><td>Agenda de fim de ano</td><td>Todos</td><td>Imagem e vídeo curto, sem preço</td></tr>
<tr><td>7</td><td>Depoimento de paciente</td><td>Todos</td><td>Vídeo (só com autorização por escrito)</td></tr>
</table></div>

<h2>Rascunhos de texto (sem preço, sem promoção)</h2>
<div class="grid g2">
  <div class="card"><span class="tag">Harmonização · ângulo 1</span>
    <p style="margin:10px 0 6px"><b>Harmonização facial com naturalidade, sem exageros.</b></p>
    <p style="margin:0;color:var(--mute)">Cada rosto tem proporções próprias, e o planejamento precisa respeitar isso. Na avaliação com a Dra. Rayane, você entende o que faz sentido para o seu rosto e o que não faz.<br><br>Atendimento em Brasília, na Sorriso Capital.<br>Toque em "Enviar mensagem" e agende sua avaliação.</p></div>
  <div class="card"><span class="tag">Lentes · ângulo 3</span>
    <p style="margin:10px 0 6px"><b>Medo de o sorriso ficar artificial?</b></p>
    <p style="margin:0;color:var(--mute)">É o receio mais comum de quem pensa em lentes de contato dental, e é legítimo. Um bom resultado depende de avaliação, planejamento do formato e da cor para o seu rosto e acompanhamento do início ao fim.<br><br>Agende sua avaliação na Sorriso Capital, no Venâncio Shopping, Asa Sul.</p></div>
  <div class="card"><span class="tag">Lentes + harmonização · ângulo 4</span>
    <p style="margin:10px 0 6px"><b>O sorriso e o rosto precisam conversar.</b></p>

function pct(a,b){ return b>0 ? (a/b*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%" : "-"; }

  set("m-roas", v.inv>0 ? (v.rec/v.inv).toLocaleString("pt-BR",{maximumFractionDigits:2})+"x" : "-");
  set("m-lead-fech", pct(v.fech, v.leads));
  var max = Math.max(v.leads, 1);
  [["leads"],["qual"],["agend"],["comp"],["orc"],["fech"]].forEach(function(k){
    var b = document.getElementById("b-"+k[0]); if (b) b.style.width = Math.min(100, v[k[0]]/max*100)+"%";
    set("n-"+k[0], String(v[k[0]]));
  });
};

<tr><td><b>Monitoramento</b> (arts. 88 a 91)</td><td>Autoclave com bomba de vácuo: teste Bowie &amp; Dick no primeiro ciclo do dia. Semanalmente, pacote teste com indicador biológico e integrador químico tipo 5 ou 6, no primeiro ciclo. Nos demais ciclos, integrador químico. Registro de cada carga com data, lote, equipamento, resultado, lista de pacotes, operador e parâmetros (tempo, temperatura, pressão).</td><td>Esse registro é a prova que sustenta o kit alugado.</td></tr>
<tr><td><b>Guarda de registros</b> (art. 92)</td><td>Mínimo de 5 anos.</td><td>Arquivo organizado por lote.</td></tr>
<tr><td><b>Terceirizar o processamento</b> (arts. 32 e 105)</td><td>Permitido, em empresa licenciada pela Vigilância Sanitária, com contrato e procedimento de preparo prévio.</td><td>Alternativa se a clínica não quiser operar esterilização em volume.</td></tr>
<tr><td><b>Prazo de adequação</b> (art. 182)</td><td>360 dias da publicação: até cerca de <b>11/12/2026</b>. Novos estabelecimentos e quem reinicia atividade devem atender na íntegra desde o início.</td><td>O art. 13 diz que quem não estava regularizado na Vigilância até a publicação é "estabelecimento novo", independentemente do tempo de funcionamento. A clínica abriu em 23/05/2026: provavelmente exigência imediata. Ver o Checklist RDC.</td></tr>
</table></div>
<p class="src">Li o texto oficial publicado no Diário Oficial da União (versão disponível no site da Vigilância Sanitária do Rio de Janeiro). Esta tela resume o que importa para o kit e para o contrato; não é parecer jurídico nem sanitário. Validar com a Vigilância Sanitária do DF e com o advogado.</p>

<h2>Por que oferecer kits</h2>
<div class="grid g3">
  <div class="card"><h3>Remove atrito da 1ª locação</h3><p style="margin:0;color:var(--mute)">O dentista chega só com a agenda. Combina com a oferta de primeira locação a R$ 50.</p></div>
  <div class="card"><h3>Receita adicional</h3><p style="margin:0;color:var(--mute)">Cobrança por uso, além da hora ou do período e da taxa de esterilização (R$ 50 por período, hoje).</p></div>
  <div class="card"><h3>Diferencial na Meta</h3><p style="margin:0;color:var(--mute)">Um anunciante de coworking (Le Doc) já lista instrumental e esterilização como parte da sala. Na minha busca não achei serviço de aluguel de kit esterilizado separado: espaço para diferenciar.</p></div>
</div>

<h2>Como ficaria a oferta (3 formatos)</h2>
<div class="tblw"><table>
<tr><th>Formato</th><th>Como funciona</th><th>Quando usar</th><th class="r">Preço</th></tr>
<tr><td><b>A. Kit incluído</b></td><td>Kit básico já vem na taxa de esterilização; o profissional não paga à parte.</td><td>Campanha de aquisição; reduz a barreira na primeira locação.</td><td class="r">Definir</td></tr>
<tr><td><b>B. Kit por uso</b></td><td>Cobrança por kit usado no período (básico, dentística, cirúrgico etc.).</td><td>Modelo principal; paga quem usa.</td><td class="r">Definir</td></tr>
<tr><td><b>C. Pacote mensal</b></td><td>Número fixo de kits por mês com preço menor por unidade.</td><td>Profissional recorrente.</td><td class="r">Definir</td></tr>
</table></div>
<p class="src">Não coloquei valores: dependem do custo real por ciclo (modelo abaixo). A taxa de esterilização atual é R$ 50 por período.</p>

<h2>Tipos de kit para definir</h2>
<div class="card"><p style="margin-top:0;color:var(--mute)">A lista de itens e as quantidades devem ser definidas pelo Responsável Técnico e pela dona, com base nos procedimentos que o coworking recebe. Categorias para começar:</p>
<ul class="clean">
<li><b>Kit clínico básico:</b> exame e atendimento de rotina</li>
<li><b>Kit dentística:</b> restaurações e estética</li>
<li><b>Kit periodontia:</b> raspagem e cirurgias gengivais</li>
<li><b>Kit cirúrgico:</b> exodontia e procedimentos cirúrgicos</li>
<li><b>Kit endodontia:</b> tratamento de canal</li>
<li><b>Kit harmonização / estética:</b> só se a clínica quiser atender a sala de estética</li></ul>
<p style="margin:10px 0 0;color:var(--mute)">Itens críticos esterilizados sem embalagem só podem ser usados em necessidade de uso imediato (art. 83). Os kits devem sair lacrados.</p></div>

<h2>Ciclo do kit</h2>
<div class="card"><ol class="steps">
<li><div><b>Entrega.</b> Kit sai lacrado da área de guarda, com etiqueta (data, preparador, lote, itens). A recepção registra quem recebeu e para qual período.</div></li>
<li><div><b>Uso.</b> O profissional abre o pacote na cadeira. O lote do kit é anotado no prontuário do paciente, para rastrear a utilização.</div></li>
<li><div><b>Devolução.</b> O profissional devolve o kit usado, ou o lacrado não usado, na área suja, sem lavar.</div></li>
<li><div><b>Limpeza e preparo.</b> Escovação ou ultrassom, secagem, conferência de itens, embalagem e etiquetagem.</div></li>
<li><div><b>Esterilização.</b> Autoclave com monitoramento da carga e registro (lote, parâmetros, integrador e, na semana, teste biológico).</div></li>
<li><div><b>Guarda.</b> Armazenamento em armário fechado e exclusivo, com validade conferida na saída.</div></li>
</ol></div>

<h2>Registros obrigatórios por carga</h2>
<div class="grid g2">
  <div class="card"><h3>Registro da carga</h3><ul class="clean">

    <li>Resultado do pacote teste</li>
    <li>Relação de pacotes esterilizados</li>
    <li>Nome do operador</li>
    <li>Tempo, temperatura e pressão</li></ul></div>
  <div class="card"><h3>Registro do kit alugado</h3><ul class="clean">
    <li>Lote e tipo do kit entregue</li>
    <li>Profissional e período da locação</li>
    <li>Data e condição da devolução</li>
    <li>Itens faltando ou danificados</li>
    <li>Guardar por pelo menos 5 anos, junto com os registros da carga</li></ul></div>
</div>

<h2>Quantos kits comprar</h2>
<div class="card"><p style="margin-top:0">Regra para dimensionar o estoque:</p>
<p><b>Kits necessários = kits usados por dia x dias do ciclo completo + reserva</b></p>
<p style="color:var(--mute);margin-bottom:0">O ciclo completo inclui uso, devolução, limpeza, embalagem, esterilização e liberação. Exemplo ilustrativo: se o coworking usa 4 kits por dia e o ciclo leva 2 dias, são 8 kits em giro, mais uma reserva de segurança. A reserva e o ciclo real devem ser medidos com a operação da clínica.</p></div>

<h2>Custo e preço</h2>
<div class="tblw"><table>

<tr><td>Embalagem e etiqueta</td><td>Preço por pacote</td><td class="r">Definir</td></tr>
<tr><td>Indicadores (integrador, teste biológico semanal rateado)</td><td>Custo mensal ÷ ciclos</td><td class="r">Definir</td></tr>

<tr><td>Tempo do auxiliar (limpeza, preparo, registro)</td><td>Minutos por kit x custo da hora</td><td class="r">Definir</td></tr>
<tr><td>Desgaste e reposição de instrumental</td><td>Custo do kit ÷ número de ciclos de vida útil</td><td class="r">Definir</td></tr>

<h2>Cláusulas para o contrato do kit</h2>
<div class="card"><ul class="clean">
<li>O instrumental é da clínica; uso exclusivo durante o período contratado.</li>
<li>Kit lacrado só deve ser aberto na cadeira, no momento do atendimento.</li>
<li>Devolução no fim do período, sem lavagem, conferida em checklist.</li>
<li>Perda ou dano: reposição a preço de tabela e perda do direito ao kit.</li>
<li>Anotar o lote do kit no prontuário de cada paciente atendido.</li>
<li>Ciência da norma interna de boas práticas (exigida de todo profissional).</li></ul></div>

<h2>Checklist de entrega e devolução</h2>
<div class="grid g2">
  <div class="card"><h3>Entrega</h3><ul class="clean">
    <li>Embalagem íntegra, seca e lacrada</li>
    <li>Etiqueta com data, preparador, lote e itens</li>
    <li>Validade conferida</li>
    <li>Indicador químico virado (quando aplicável)</li>
    <li>Registro de quem recebeu</li></ul></div>
  <div class="card"><h3>Devolução</h3><ul class="clean">
    <li>Todos os itens presentes</li>
    <li>Sem sinais de dano</li>
    <li>Lote anotado no prontuário</li>
    <li>Kit encaminhado para a área suja</li>
    <li>Registro de condição de devolução</li></ul></div>
</div>

<h2>Riscos e decisões pendentes</h2>
<div class="tblw"><table>
<tr><th>Risco ou dúvida</th><th>Ação</th></tr>
<tr><td>A clínica é "estabelecimento novo" (art. 13: exigência imediata e licença sanitária inicial)?</td><td>Confirmar com a Vigilância Sanitária do DF; usar o Checklist RDC.</td></tr>

<tr><td>Cláusulas de isenção do contrato conflitam com a corresponsabilidade do RT?</td><td>Advogado revisa contrato de coworking e termo do paciente.</td></tr>
<tr><td>A autoclave tem bomba de vácuo? Qual o volume da câmara?</td><td>Define Bowie &amp; Dick e a norma aplicável (acima de 60 litros segue outra RDC).</td></tr>
<tr><td>Operar esterilização em volume ou terceirizar?</td><td>Comparar custo e capacidade; terceirizar exige empresa licenciada e contrato.</td></tr>
<tr><td>Quem opera o processamento no dia a dia?</td><td>Treinar e registrar; a norma exige operador identificado.</td></tr>
</table></div>

<h2>Próximos passos</h2>
<div class="card"><ul class="clean">
<li>Confirmar com o Responsável Técnico e com a Vigilância Sanitária os pontos acima.</li>

<li>Definir composição de 2 ou 3 kits iniciais e medir o custo por ciclo.</li>
<li>Só depois fechar o preço, revisar o contrato e anunciar o kit no coworking.</li>
<li>Antes de anunciar, atualizar o flyer e o contrato com a esterilização e a ciência da norma.</li></ul></div>
`);

function load(id){
  return new Promise(res => {
    if (VIEWS[id]) return res();
    const s = document.createElement('script'); s.src = 'views/' + id + '.js'; /* offline: telas embutidas */
    s.onload = res; s.onerror = () => { VIEWS[id] = '<h1>Tela indisponível</h1><p class="lead">Não consegui carregar views/'+id+'.js.</p>'; res(); };
    document.head.appendChild(s);
  });
}
async function route(){
  const id = (location.hash.replace('#/','') || 'visao-geral');
  const m = MENU.find(x => x.id === id) || MENU.find(x => x.id === 'visao-geral');
  document.querySelectorAll('nav a.it').forEach(a => a.classList.toggle('on', a.dataset.id === m.id));
  document.getElementById('topTitle').textContent = m.t;
  document.title = m.t + ' | Sorriso Capital';
  if (m.ready) { main.innerHTML = '<p class="lead">Carregando…</p>'; await load(m.id); main.innerHTML = VIEWS[m.id]; ckHydrate(); if (VIEW_INIT[m.id]) { try { VIEW_INIT[m.id](); } catch(e){ console.error(e); } } }
  else main.innerHTML = stub(m);
  document.body.classList.remove('open');
  window.scrollTo(0,0); main.focus({preventScroll:true});
}
window.addEventListener('hashchange', route);
document.getElementById('burger').onclick = () => document.body.classList.toggle('open');
document.getElementById('scrim').onclick = () => document.body.classList.remove('open');
route();
</script>
